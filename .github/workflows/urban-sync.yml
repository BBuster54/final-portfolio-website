name: Urban synchronization and single project
on:
  push:
    paths: ['public/demos/urban-insight/**', 'src/data/projects.ts', 'scripts/check-urban-sync.mjs', '.github/workflows/urban-sync.yml']
  pull_request:
    paths: ['public/demos/urban-insight/**', 'src/data/projects.ts', 'scripts/check-urban-sync.mjs', '.github/workflows/urban-sync.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-urban-sync.mjs
